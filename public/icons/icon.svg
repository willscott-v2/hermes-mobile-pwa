<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hermes Mobile">
  <defs>
    <linearGradient id="bg" x1="86" y1="54" x2="428" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="gold" x1="120" y1="118" x2="388" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="mint" x1="110" y1="112" x2="406" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fffc7"/>
      <stop offset="1" stop-color="#3ccf91"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ffb000" stroke-width="18" opacity=".24"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#3ccf91" stroke-width="10" opacity=".18"/>

