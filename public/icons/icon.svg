  <path d="M119 210h88l-32 30h-70c-14 0-22-17-12-27 6-5 15-3 26-3Z" fill="url(#mint)" opacity=".95"/>
  <path d="M393 210h-88l32 30h70c14 0 22-17 12-27-6-5-15-3-26-3Z" fill="url(#mint)" opacity=".95"/>
  <path d="M108 270h87l-30 30h-70c-14 0-22-17-12-27 6-5 14-3 25-3Z" fill="url(#mint)" opacity=".72"/>
  <path d="M404 270h-87l30 30h70c14 0 22-17 12-27-6-5-14-3-25-3Z" fill="url(#mint)" opacity=".72"/>

  <!-- bold H for small-size readability -->
  <path d="M178 156c0-12 10-22 22-22h24c12 0 22 10 22 22v75h20v-75c0-12 10-22 22-22h24c12 0 22 10 22 22v200c0 12-10 22-22 22h-24c-12 0-22-10-22-22v-78h-20v78c0 12-10 22-22 22h-24c-12 0-22-10-22-22V156Z" fill="url(#gold)" filter="url(#softGlow)"/>
  <rect x="205" y="242" width="102" height="38" rx="19" fill="#050607" opacity=".74"/>
  <rect x="222" y="253" width="68" height="16" rx="8" fill="url(#gold)"/>

